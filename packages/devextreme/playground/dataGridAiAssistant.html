    <script>
    const ACTION_NAMES = Object.freeze([
        'sorting', 'clearSorting', 'filtering', 'filterValue', 'clearFilter',
        'searching', 'grouping', 'page', 'pageSize', 'rowFocusing',
        'selectByKeys', 'selectByIndexes', 'selectAll', 'deselectAll', 'clearSelection',
        'columnsVisibility', 'columnsReorder', 'columnsPinning', 'columnsResize',
        'summary', 'clearSummary', 'help',
    ]);

    const ACTION_HELP = Object.freeze({
        sorting:           'Sort a column ascending, descending, or remove its sort',
        clearSorting:      'Remove sorting from all columns at once',
        filtering:         'Set or clear a filter value on a single column',
        filterValue:       'Apply a combined filter expression across columns',
        clearFilter:       'Remove all active filters (column-level, combined, and search)',
        searching:         'Set or clear the global search text',
        grouping:          'Group rows by a column or remove grouping',
        page:              'Navigate to a specific page (1-based: page 1 is first)',
        pageSize:          'Change the number of rows per page',
        rowFocusing:       'Focus and scroll to a specific row by key',
        selectByKeys:      'Select rows by their key values',
        selectByIndexes:   'Select rows by their visible indexes on the current page',
        selectAll:         'Select all rows across all pages',
        deselectAll:       'Deselect all currently selected rows',
        clearSelection:    'Clear the entire selection',
        columnsVisibility: 'Show or hide a column',
        columnsReorder:    'Move a column to a new visual position',
        columnsPinning:    'Pin (fix) a column to the left or right edge',
        columnsResize:     'Change a column width',
        summary:           'Add total or group summary items (count, sum, min, max, avg)',
        clearSummary:      'Remove all summary items',
        help:              'Show this list of available actions',
    });

    function _success() { return { status: 'success' }; }
    function _failure(msg) { return { status: 'failure', error: msg }; }
    function _isActionName(name) { return ACTION_NAMES.includes(name); }

    class DataGridToolingApi {
        constructor(grid) {
            this._grid = grid;
            this._handlers = {
                sorting:           (p) => this._sorting(p),
                clearSorting:      ()  => this._clearSorting(),
                filtering:         (p) => this._filtering(p),
                filterValue:       (p) => this._filterValue(p),
                clearFilter:       ()  => this._clearFilter(),
                searching:         (p) => this._searching(p),
                grouping:          (p) => this._grouping(p),
                page:              (p) => this._page(p),
                pageSize:          (p) => this._pageSize(p),
                rowFocusing:       (p) => this._rowFocusing(p),
                selectByKeys:      (p) => this._selectByKeys(p),
                selectByIndexes:   (p) => this._selectByIndexes(p),
                selectAll:         ()  => this._selectAll(),
                deselectAll:       ()  => this._deselectAll(),
                clearSelection:    ()  => this._clearSelection(),
                columnsVisibility: (p) => this._columnsVisibility(p),
                columnsReorder:    (p) => this._columnsReorder(p),
                columnsPinning:    (p) => this._columnsPinning(p),
                columnsResize:     (p) => this._columnsResize(p),
                summary:           (p) => this._summary(p),
                clearSummary:      ()  => this._clearSummary(),
                help:              ()  => this._help(),
            };
        }

        getAvailableActions() { return ACTION_NAMES; }

        getHelp() {
            return Object.entries(ACTION_HELP).map(([name, description]) => ({ name, description }));
        }

        async action(name, payload) {
            if (!_isActionName(name))
                return _failure(`Unknown action "${name}".`);
            try {
                return await this._handlers[name](payload);
            } catch (e) {
                return _failure(`Action "${name}" threw: ${e.message || e}`);
            }
        }

        _colExists(df) { return this._grid.columnOption(df) !== undefined; }

        _validateCol(df) {
            return this._colExists(df) ? null : _failure(`Column "${df}" not found.`);
        }

        async _refresh() {
            try { await Promise.resolve(this._grid.refresh()); return null; }
            catch (e) { return _failure(`Refresh failed: ${e.message || e}`); }
        }

        async _sorting(p) {
            let err = this._validateCol(p.dataField);
            if (err) return err;

            const order = p.sortOrder === 'none' ? undefined : p.sortOrder;
            this._grid.columnOption(p.dataField, 'sortOrder', order);

            err = await this._refresh();
            if (err) return err;

            const actual = this._grid.columnOption(p.dataField, 'sortOrder');
            if (order === undefined && actual !== undefined)
                return _failure(`Could not clear sorting on "${p.dataField}".`);
            if (order !== undefined && actual !== order)
                return _failure(`Could not set "${p.dataField}" sort to "${order}".`);

            return _success();
        }

        async _clearSorting() {
            this._grid.clearSorting();
            const err = await this._refresh();
            if (err) return err;

            const still = this._grid.getVisibleColumns().filter(c => c.sortOrder !== undefined);
            if (still.length)
                return _failure('Some columns still have sorting applied.');

            return _success();
        }

        async _filtering(p) {
            let err = this._validateCol(p.dataField);
            if (err) return err;

            this._grid.columnOption(p.dataField, 'filterValue', p.filterValue);
            err = await this._refresh();
            if (err) return err;

            const actual = this._grid.columnOption(p.dataField, 'filterValue');
            if (p.filterValue === null && actual != null)
                return _failure(`Could not clear filter on "${p.dataField}".`);
            if (p.filterValue !== null && actual !== p.filterValue)
                return _failure(`Could not set filter on "${p.dataField}".`);

            return _success();
        }

        async _filterValue(p) {
            this._grid.option('filterValue', p.expression);
            const err = await this._refresh();
            if (err) return err;

            const actual = this._grid.option('filterValue');
            if (p.expression === null && actual != null)
                return _failure('Could not clear the combined filter.');
            if (p.expression !== null && actual == null)
                return _failure('Combined filter was not applied.');

            return _success();
        }

        async _clearFilter() {
            this._grid.clearFilter();
            const err = await this._refresh();
            if (err) return err;

            if (this._grid.getCombinedFilter() !== undefined)
                return _failure('Some filters are still active.');

            return _success();
        }

        async _searching(p) {
            this._grid.searchByText(p.text);
            const err = await this._refresh();
            if (err) return err;

            if (this._grid.option('searchPanel.text') !== p.text)
                return _failure('Search text was not applied.');

            return _success();
        }

        async _grouping(p) {
            let err = this._validateCol(p.dataField);
            if (err) return err;

            this._grid.columnOption(p.dataField, 'groupIndex', p.groupIndex);
            err = await this._refresh();
            if (err) return err;

            const actual = this._grid.columnOption(p.dataField, 'groupIndex');
            if (p.groupIndex === undefined && actual !== undefined && actual !== -1)
                return _failure(`Could not remove grouping on "${p.dataField}".`);
            if (p.groupIndex !== undefined && actual !== p.groupIndex)
                return _failure(`Could not set grouping on "${p.dataField}".`);

            return _success();
        }

        async _page(p) {
            const page = p.page;
            if (!Number.isInteger(page) || page < 1)
                return _failure('Page must be a positive integer.');

            const count = this._grid.pageCount();
            if (count > 0 && page > count)
                return _failure(`Page ${page} is out of range (${count} pages total).`);

            const idx = page - 1;
            await Promise.resolve(this._grid.pageIndex(idx));
            if (this._grid.pageIndex() !== idx)
                return _failure('Page navigation failed.');

            return _success();
        }

        async _pageSize(p) {
            const size = p.pageSize;
            if (!Number.isInteger(size) || size <= 0)
                return _failure('Page size must be a positive integer.');

            this._grid.pageSize(size);
            if (this._grid.pageSize() !== size)
                return _failure('Could not change page size.');

            return _success();
        }

        async _rowFocusing(p) {
            if (!this._grid.option('focusedRowEnabled'))
                return _failure('Focused row feature is not enabled.');

            this._grid.option('focusedRowKey', p.key);
            await Promise.resolve(this._grid.navigateToRow(p.key));

            if (this._grid.option('focusedRowKey') !== p.key)
                return _failure('Could not focus the requested row.');

            return _success();
        }

        async _selectByKeys(p) {
            await Promise.resolve(this._grid.selectRows(p.keys, p.preserve));
            const selected = this._grid.getSelectedRowKeys();

            if (!p.keys.every(k => selected.indexOf(k) !== -1))
                return _failure('Not all requested rows were selected.');

            return _success();
        }

        async _selectByIndexes(p) {
            if (p.indexes.some(i => !Number.isInteger(i) || i < 0))
                return _failure('Indexes must be non-negative integers.');

            await Promise.resolve(this._grid.selectRowsByIndexes(p.indexes));
            if (this._grid.getSelectedRowKeys().length === 0 && p.indexes.length > 0)
                return _failure('Selection by indexes produced no results.');

            return _success();
        }

        async _selectAll() {
            await Promise.resolve(this._grid.selectAll());
            if (this._grid.totalCount() > 0 && this._grid.getSelectedRowKeys().length === 0)
                return _failure('Select all produced no results.');

            return _success();
        }

        async _deselectAll() {
            await Promise.resolve(this._grid.deselectAll());
            if (this._grid.getSelectedRowKeys().length !== 0)
                return _failure('Some rows are still selected.');

            return _success();
        }

        async _clearSelection() {
            this._grid.clearSelection();
            if (this._grid.getSelectedRowKeys().length !== 0)
                return _failure('Selection was not fully cleared.');

            return _success();
        }

        async _columnsVisibility(p) {
            const err = this._validateCol(p.dataField);
            if (err) return err;

            this._grid.columnOption(p.dataField, 'visible', p.visible);
            if (this._grid.columnOption(p.dataField, 'visible') !== p.visible)
                return _failure(`Could not ${p.visible ? 'show' : 'hide'} column "${p.dataField}".`);

            return _success();
        }

        async _columnsReorder(p) {
            const err = this._validateCol(p.dataField);
            if (err) return err;

            if (!Number.isInteger(p.visibleIndex) || p.visibleIndex < 0)
                return _failure('Visible index must be a non-negative integer.');

            this._grid.columnOption(p.dataField, 'visibleIndex', p.visibleIndex);
            if (this._grid.columnOption(p.dataField, 'visibleIndex') !== p.visibleIndex)
                return _failure(`Could not move column "${p.dataField}".`);

            return _success();
        }

        async _columnsPinning(p) {
            const err = this._validateCol(p.dataField);
            if (err) return err;

            this._grid.columnOption(p.dataField, {
                fixed: p.fixed,
                fixedPosition: p.fixed ? (p.fixedPosition || 'left') : undefined,
            });

            if (this._grid.columnOption(p.dataField, 'fixed') !== p.fixed)
                return _failure(`Could not ${p.fixed ? 'pin' : 'unpin'} column "${p.dataField}".`);

            if (p.fixed) {
                const expected = p.fixedPosition || 'left';
                if (this._grid.columnOption(p.dataField, 'fixedPosition') !== expected)
                    return _failure(`Column "${p.dataField}" pinned but not at the expected position.`);
            }

            return _success();
        }

        async _columnsResize(p) {
            const err = this._validateCol(p.dataField);
            if (err) return err;

            if (typeof p.width === 'number' && p.width <= 0)
                return _failure('Width must be a positive value.');

            this._grid.columnOption(p.dataField, 'width', p.width);
            if (this._grid.columnOption(p.dataField, 'width') !== p.width)
                return _failure(`Could not resize column "${p.dataField}".`);

            return _success();
        }

        async _summary(p) {
            if (p.totalItems === undefined && p.groupItems === undefined)
                return _failure('Provide at least "totalItems" or "groupItems".');

            const current = this._grid.option('summary') || {};
            const next = Object.assign({}, current);
            if (p.totalItems !== undefined) next.totalItems = p.totalItems;
            if (p.groupItems !== undefined) next.groupItems = p.groupItems;

            this._grid.option('summary', next);
            const err = await this._refresh();
            if (err) return err;

            const applied = this._grid.option('summary') || {};
            if (p.totalItems && (applied.totalItems || []).length !== p.totalItems.length)
                return _failure('Total summary items count mismatch.');
            if (p.groupItems && (applied.groupItems || []).length !== p.groupItems.length)
                return _failure('Group summary items count mismatch.');

            return _success();
        }

        async _clearSummary() {
            this._grid.option('summary', { totalItems: [], groupItems: [] });
            const err = await this._refresh();
            if (err) return err;

            const applied = this._grid.option('summary') || {};
            if ((applied.totalItems || []).length || (applied.groupItems || []).length)
                return _failure('Summary was not fully cleared.');

            return _success();
        }

        async _help() {
            return { status: 'success', help: this.getHelp() };
        }
    }

    const SYSTEM_PROMPT = `You help users control a DevExtreme DataGrid by returning a list of actions.

Respond with JSON: { "actions": [...], "explanation": "..." }

Each action: { "action": "<name>", "payload": { ... } }

Actions and payloads:

1. sorting          — { "dataField": string, "sortOrder": "asc"|"desc"|"none" }
2. clearSorting     — {}
3. filtering        — { "dataField": string, "filterValue": string|number|null }
4. filterValue      — { "expression": <FilterExpr>|null }
   FilterExpr: ["field","op",value], ops: =, <>, <, <=, >, >=, contains, notcontains, startswith, endswith
   Combine: [expr,"and"|"or",expr]  Negate: ["!",expr]
5. clearFilter      — {}
6. searching        — { "text": string }
7. grouping         — { "dataField": string, "groupIndex": number|null }
8. page             — { "page": number } (1-based: page 1 is first)
9. pageSize         — { "pageSize": number }
10. rowFocusing     — { "key": number }
11. selectByKeys    — { "keys": [number,...], "preserve": boolean }
12. selectByIndexes — { "indexes": [number,...] }
13. selectAll       — {}
14. deselectAll     — {}
15. clearSelection  — {}
16. columnsVisibility — { "dataField": string, "visible": boolean }
17. columnsReorder    — { "dataField": string, "visibleIndex": number }
18. columnsPinning    — { "dataField": string, "fixed": boolean, "fixedPosition": "left"|"right" }
19. columnsResize     — { "dataField": string, "width": number|string }
20. summary         — { "totalItems": [{"column":string,"summaryType":"sum"|"min"|"max"|"avg"|"count"}], "groupItems": [...] }
21. clearSummary    — {}
22. help            — {}

Grid key: "ID" (1–12). Columns: ID (hidden), CompanyName, Address (hidden), City, State, Zipcode (hidden), Phone, Fax (hidden), Website.
12 company rows.

Rules:
- Output ONLY valid JSON: { "actions": [...], "explanation": "..." }
- null for groupIndex to remove grouping
- selectByKeys keys are ID numbers 1–12
- Actions run sequentially
- To reset: clearSorting + clearFilter + clearSelection + clearSummary + restore column visibility
- If user asks what you can do, use the help action`;

    const AzureOpenAIConfig = {
        deployment: 'gpt-4o-mini',
        apiVersion: '2024-10-21',
        endpoint: 'https://public-api.devexpress.com/demo-openai',
        apiKey: 'DEMO',
    };

    let chatService;

    function ensureChatService() {
        if (chatService) return;
        if (!window.AzureOpenAI) throw new Error('AzureOpenAI SDK not loaded yet.');

        chatService = new window.AzureOpenAI({
            dangerouslyAllowBrowser: true,
            deployment: AzureOpenAIConfig.deployment,
            endpoint: AzureOpenAIConfig.endpoint,
            apiVersion: AzureOpenAIConfig.apiVersion,
            apiKey: AzureOpenAIConfig.apiKey,
        });
    }

    async function getAIResponse(userMessage) {
        ensureChatService();

        const response = await chatService.chat.completions.create({
            messages: [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'user', content: userMessage },
            ],
            model: AzureOpenAIConfig.deployment,
            max_tokens: 1000,
            temperature: 0.2,
            response_format: { type: 'json_object' },
        });

        const content = response.choices?.[0]?.message?.content;
        if (!content) throw new Error('Empty response from AI.');

        const parsed = JSON.parse(content);

        let actions = [];
        if (Array.isArray(parsed.actions)) actions = parsed.actions;
        else if (Array.isArray(parsed)) actions = parsed;
        else if (parsed.action) actions = [parsed];

        return {
            actions,
            explanation: parsed.explanation || '',
        };
    }

    async function executeActions(api, actions) {
        const results = [];

        for (const a of actions) {
            const name = a.action;
            const payload = a.payload || {};

            if (name === 'grouping' && payload.groupIndex === null)
                payload.groupIndex = undefined;

            const result = await api.action(name, payload);
            results.push({ action: name, payload, result });
        }

        return results;
    }

        function updateIcon($container, iconName) {

        function buildActionResultsHtml(results) {
            const lines = results.map(r => {
                const ok = r.result.status === 'success';
                const icon = ok ? '✓' : '✗';
                const cls = ok ? 'ok' : 'fail';
                const errorHtml = ok ? '' : `<span class="action-error"> — ${r.result.error}</span>`;
                return `<div class="action-result-item ${cls}">`
                    + `<span>${icon}</span>`
                    + `<span class="action-name">${r.action}</span>`
                    + errorHtml
                    + `</div>`;
            });
            return `<div class="action-results">${lines.join('')}</div>`;
        }

        function buildHelpHtml(helpItems) {
            const lines = helpItems.map(h =>
                `<div class="action-result-item ok">`
                + `<span class="action-name">${h.name}</span>`
                + `<span> — ${h.description}</span>`
                + `</div>`
            );
            return `<div class="action-results">${lines.join('')}</div>`;
        }

        async function renderMessageContent(message, element) {
            const $container = $('<div/>')
                .addClass('message-container dx-pending')
                .appendTo(element);

            $('<i/>').addClass('my-icon dx-icon dx-icon-sparkle').appendTo($container);

            const $content = $('<div/>').addClass('message-content').appendTo($container);

            $('<b>')
                .addClass('dx-chat-messagebubble-header')
                .text(message.text)
                .appendTo($content);

            const $operation = $('<div>')
                .addClass('dx-chat-messagebubble-operation')
                .text('Processing…')
                .appendTo($content);

            const progressBar = $('<div>').dxProgressBar({
                value: false,
                visible: true,
                showStatus: false,
                width: '100%',
            }).appendTo(element).dxProgressBar('instance');

            try {
                const aiResponse = await getAIResponse(message.text);
                const results = await executeActions(api, aiResponse.actions);

                progressBar.option('visible', false);

                const hasHelp = results.some(r => r.action === 'help' && r.result.help);
                const allOk = results.every(r => r.result.status === 'success');

                if (hasHelp) {
                    const helpResult = results.find(r => r.result.help);
                    $container.removeClass('dx-pending').addClass('dx-success');
                    updateIcon($container, 'help');
                    $operation.text(aiResponse.explanation || 'Here are the available actions:');
                    $content.append(buildHelpHtml(helpResult.result.help));
                } else if (allOk) {
                    $container.removeClass('dx-pending').addClass('dx-success');
                    updateIcon($container, 'checkmarkcircle');
                    $operation.text(aiResponse.explanation || 'Done');
                    $content.append(buildActionResultsHtml(results));
                } else {
                    const failCount = results.filter(r => r.result.status !== 'success').length;
                    $container.removeClass('dx-pending').addClass('dx-error');
                    updateIcon($container, 'info');
                    $operation.text(`${failCount} of ${results.length} action(s) failed`);
                    $content.append(buildActionResultsHtml(results));
                }
            } catch (err) {
                progressBar.option('visible', false);
                $container.removeClass('dx-pending').addClass('dx-error');
                updateIcon($container, 'info');
                $operation.text(err.message || String(err));
            }
        }

        $('#aiAssistant').dxPopup({
            title: 'AI Assistant (Tooling API)',
            width: 600,
            height: '80%',
            visible: false,
            showCloseButton: true,
            toolbarItems: [{
                toolbar: 'top',
                location: 'after',
                widget: 'dxButton',
                options: {
                    icon: 'chatadd',
                    stylingMode: 'text',
                    onClick() {
                        $('#chatContainer').dxChat('instance').option('dataSource', []);
                    },
                },
            }],
            contentTemplate() {
                return $('<div>').attr('id', 'chatContainer').dxChat({
                    user: { id: 'user1', name: 'User' },
                    dataSource: [],
                    height: '100%',
                    showAvatar: false,
                    showDayHeaders: false,
                    showMessageTimestamp: false,
                    onMessageEntered(e) {
                        const chat = e.component;

                        chat.option('dataSource', [
                            ...chat.option('dataSource'),
                            {
                                id: Date.now(),
                                timestamp: new Date(),
                                author: { id: 'assistant', name: 'AI Assistant' },
                                text: e.message.text,
                            },
                        ]);
                    },
                    messageTemplate(data, element) {
                        if (data.message.author?.id === 'assistant') {
                            renderMessageContent(data.message, element);
                        } else {
                            element.text(data.message.text);
                        }
                    },
                });
            },
        });
    });
    </script>
</body>
</html>
