<!DOCTYPE html>
<html lang="en">
<head>
    <title>DataGrid Tooling API — Playground</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script type="text/javascript">
        const currentThemeId = localStorage.getItem("currentThemeId") || "light";

        const link = document.createElement("link");
        link.href = `../artifacts/css/dx.${currentThemeId}.css`;
        link.type = "text/css";
        link.rel = "stylesheet";

        document.getElementsByTagName("head")[0].appendChild(link);
    </script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* ── Log panel ── */
        #log {
            margin-top: 12px;
            padding: 12px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
        }
        #log:empty::before {
            content: "Click any action button above to see results here…";
            color: #999;
            font-style: italic;
        }
        #log .log-section { margin: 8px 0 4px; font-weight: bold; color: #333; }
        #log .log-success  { color: #2e7d32; }
        #log .log-failure  { color: #c62828; }
        #log .log-args     { color: #555; font-size: 12px; margin-left: 18px; }

        /* ── Action panel ── */
        #actions-panel {
            margin-top: 16px;
        }
        .action-section {
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        .action-section-header {
            background: #f0f0f0;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 6px 6px 0 0;
        }
        .action-section-body {
            padding: 10px 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .action-btn-wrap {
            position: relative;
        }
        .action-btn-wrap .tip {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-line;
            z-index: 10000;
            min-width: 260px;
            max-width: 400px;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            pointer-events: none;
        }
        .action-btn-wrap .tip::after {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            margin-left: -5px;
            border: 5px solid transparent;
            border-bottom-color: #333;
        }
        .action-btn-wrap:hover .tip { display: block; }

        /* ── Top panel (grid + toolbar + log, sticky) ── */
        #top-panel {
            position: sticky;
            top: 0;
            z-index: 60;
            background: var(--dx-component-color-bg);
            padding-bottom: 4px;
        }

        /* ── Toolbar row ── */
        .toolbar-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
        }

        /* ── Data mode indicator ── */
        #dataModeBadge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
        }
        #dataModeBadge.local  { background: #e8f5e9; color: #2e7d32; }
        #dataModeBadge.remote { background: #e3f2fd; color: #1565c0; }
    </style>

    <script type="text/javascript" src="../artifacts/js/jquery.js"></script>
    <script type="text/javascript" src="../artifacts/js/dx.all.debug.js" charset="utf-8"></script>
    <script type="text/javascript" src="./themeSelector.js"></script>
</head>
<body class="dx-surface">
    <div role="main">
        <h1 style="position: fixed; left: 0; top: 0; clip: rect(1px, 1px, 1px, 1px);">DataGrid Tooling API</h1>

        <select id="theme-selector" style="display: block;"></select>
        <br />

        <!-- Top panel: grid + toolbar + log (sticky) -->
        <div id="top-panel">
            <!-- DataGrid container -->
            <div id="gridContainer"></div>

            <!-- Toolbar: data mode switch + Run All + Clear Log -->
            <div class="toolbar-row">
                <div id="dataModeSwitch"></div>
                <span id="dataModeBadge" class="local">📦 Local data</span>
                <div id="runAllButton"></div>
                <div id="clearLogButton"></div>
            </div>

            <!-- Log output -->
            <div id="log"></div>
        </div>

        <!-- Action buttons panel -->
        <div id="actions-panel"></div>
    </div>

    <script>
    /**
     * ====================================================================
     *  DataGrid Tooling API  (transpiled from dataGridToolingApi.ts)
     *
     *  Authoritative TypeScript source:  ./dataGridToolingApi.ts
     * ====================================================================
     */

    // ── Constants & helpers ──────────────────────

    const ACTION_NAMES = Object.freeze([
        'sorting', 'clearSorting', 'filtering', 'filterValue', 'clearFilter',
        'searching', 'grouping', 'page', 'pageSize', 'rowFocusing',
        'selectByKeys', 'selectByIndexes', 'selectAll', 'deselectAll', 'clearSelection',
        'columnsVisibility', 'columnsReorder', 'columnsPinning', 'columnsResize',
        'summary', 'clearSummary',
    ]);

    function _success() { return { status: 'success' }; }
    function _failure(error) { return { status: 'failure', error: error }; }
    function _isActionName(name) { return ACTION_NAMES.includes(name); }
    function _toPromise(v) { return Promise.resolve(v); }

    // ── DataGridToolingApi class ─────────────────

    class DataGridToolingApi {
        constructor(grid) {
            this._grid = grid;
            this._handlers = {
                sorting:           (p) => this._sorting(p),
                clearSorting:      (p) => this._clearSorting(p),
                filtering:         (p) => this._filtering(p),
                filterValue:       (p) => this._filterValue(p),
                clearFilter:       (p) => this._clearFilter(p),
                searching:         (p) => this._searching(p),
                grouping:          (p) => this._grouping(p),
                page:              (p) => this._page(p),
                pageSize:          (p) => this._pageSize(p),
                rowFocusing:       (p) => this._rowFocusing(p),
                selectByKeys:      (p) => this._selectByKeys(p),
                selectByIndexes:   (p) => this._selectByIndexes(p),
                selectAll:         (p) => this._selectAll(p),
                deselectAll:       (p) => this._deselectAll(p),
                clearSelection:    (p) => this._clearSelection(p),
                columnsVisibility: (p) => this._columnsVisibility(p),
                columnsReorder:    (p) => this._columnsReorder(p),
                columnsPinning:    (p) => this._columnsPinning(p),
                columnsResize:     (p) => this._columnsResize(p),
                summary:           (p) => this._summary(p),
                clearSummary:      (p) => this._clearSummary(p),
            };
        }

        getAvailableActions() { return ACTION_NAMES; }

        async action(name, payload) {
            if (!_isActionName(name)) {
                return _failure('Unknown action: "' + name + '". Available: ' + ACTION_NAMES.join(', '));
            }
            try {
                return await this._handlers[name](payload);
            } catch (e) {
                return _failure('Action "' + name + '" threw: ' + (e.message || e));
            }
        }

        _colExists(df) { return this._grid.columnOption(df) !== undefined; }
        _validateCol(df) {
            if (!this._colExists(df)) return _failure('Column "' + df + '" does not exist.');
            return null;
        }

        // Wait for data reload to complete (critical for remote data sources).
        // Returns null on success, or a failure ActionResult if refresh rejects.
        async _waitForDataReady() {
            try { await _toPromise(this._grid.refresh()); return null; }
            catch(e) { return _failure('Data refresh failed: ' + (e.message || e)); }
        }

        async _sorting(p) {
            var err = this._validateCol(p.dataField); if (err) return err;
            var order = p.sortOrder === 'none' ? undefined : p.sortOrder;
            this._grid.columnOption(p.dataField, 'sortOrder', order);
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var actual = this._grid.columnOption(p.dataField, 'sortOrder');
            if (order === undefined && actual !== undefined)
                return _failure('Sorting was not cleared for "' + p.dataField + '". Got: "' + actual + '".');
            if (order !== undefined && actual !== order)
                return _failure('Expected sortOrder "' + order + '" for "' + p.dataField + '", got "' + actual + '".');
            return _success();
        }

        async _clearSorting() {
            this._grid.clearSorting();
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var cols = this._grid.getVisibleColumns();
            var still = cols.filter(function(c) { return c.sortOrder !== undefined; });
            if (still.length > 0)
                return _failure('clearSorting failed. Still sorted: ' + still.map(function(c){ return c.dataField; }).join(', '));
            return _success();
        }

        async _filtering(p) {
            var err = this._validateCol(p.dataField); if (err) return err;
            this._grid.columnOption(p.dataField, 'filterValue', p.filterValue);
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var actual = this._grid.columnOption(p.dataField, 'filterValue');
            if (p.filterValue === null && actual !== undefined && actual !== null)
                return _failure('Filter not cleared for "' + p.dataField + '". Got: "' + actual + '".');
            if (p.filterValue !== null && actual !== p.filterValue)
                return _failure('Expected filterValue "' + p.filterValue + '" for "' + p.dataField + '", got "' + actual + '".');
            return _success();
        }

        async _filterValue(p) {
            this._grid.option('filterValue', p.expression);
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var actual = this._grid.option('filterValue');
            if (p.expression === null) {
                if (actual !== null && actual !== undefined)
                    return _failure('filterValue was not cleared. Got: ' + JSON.stringify(actual));
            } else {
                if (actual === null || actual === undefined)
                    return _failure('filterValue was not applied — grid returned null/undefined.');
            }
            return _success();
        }

        async _clearFilter() {
            this._grid.clearFilter();
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var combined = this._grid.getCombinedFilter();
            if (combined !== undefined)
                return _failure('clearFilter failed. Combined: ' + JSON.stringify(combined));
            return _success();
        }

        async _searching(p) {
            this._grid.searchByText(p.text);
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var actual = this._grid.option('searchPanel.text');
            if (actual !== p.text)
                return _failure('Expected searchPanel.text "' + p.text + '", got "' + actual + '".');
            return _success();
        }

        async _grouping(p) {
            var err = this._validateCol(p.dataField); if (err) return err;
            this._grid.columnOption(p.dataField, 'groupIndex', p.groupIndex);
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var actual = this._grid.columnOption(p.dataField, 'groupIndex');
            if (p.groupIndex === undefined && actual !== undefined && actual !== -1)
                return _failure('Grouping not cleared for "' + p.dataField + '". Got: ' + actual);
            if (p.groupIndex !== undefined && actual !== p.groupIndex)
                return _failure('Expected groupIndex ' + p.groupIndex + ' for "' + p.dataField + '", got ' + actual);
            return _success();
        }

        async _page(p) {
            var page = p.page;
            if (!Number.isInteger(page) || page < 1)
                return _failure('Page must be a positive integer. Got: ' + page);
            var count = this._grid.pageCount();
            if (count > 0 && page > count)
                return _failure('Page ' + page + ' is out of range. Total pages: ' + count);
            var idx = page - 1;
            await _toPromise(this._grid.pageIndex(idx));
            var actual = this._grid.pageIndex();
            if (actual !== idx) return _failure('Expected page ' + page + ', got ' + (actual + 1));
            return _success();
        }

        async _pageSize(p) {
            var size = p.pageSize;
            if (!Number.isInteger(size) || size <= 0)
                return _failure('pageSize must be positive integer. Got: ' + size);
            this._grid.pageSize(size);
            var actual = this._grid.pageSize();
            if (actual !== size) return _failure('Expected pageSize ' + size + ', got ' + actual);
            return _success();
        }

        async _rowFocusing(p) {
            if (!this._grid.option('focusedRowEnabled'))
                return _failure('focusedRowEnabled is not true. Enable it first.');
            this._grid.option('focusedRowKey', p.key);
            await _toPromise(this._grid.navigateToRow(p.key));
            var actual = this._grid.option('focusedRowKey');
            if (actual !== p.key)
                return _failure('Expected focusedRowKey ' + JSON.stringify(p.key) + ', got ' + JSON.stringify(actual));
            return _success();
        }

        async _selectByKeys(p) {
            await _toPromise(this._grid.selectRows(p.keys, p.preserve));
            var selected = this._grid.getSelectedRowKeys();
            var allPresent = p.keys.every(function(k) { return selected.indexOf(k) !== -1; });
            if (!allPresent)
                return _failure('Not all keys selected. Requested: ' + JSON.stringify(p.keys) + ', actual: ' + JSON.stringify(selected));
            return _success();
        }

        async _selectByIndexes(p) {
            var bad = p.indexes.find(function(i) { return !Number.isInteger(i) || i < 0; });
            if (bad !== undefined) return _failure('Invalid index: ' + bad);
            await _toPromise(this._grid.selectRowsByIndexes(p.indexes));
            var selected = this._grid.getSelectedRowKeys();
            if (selected.length === 0 && p.indexes.length > 0)
                return _failure('selectRowsByIndexes resulted in empty selection.');
            return _success();
        }

        async _selectAll() {
            await _toPromise(this._grid.selectAll());
            var selected = this._grid.getSelectedRowKeys();
            var total = this._grid.totalCount();
            if (total > 0 && selected.length === 0) return _failure('selectAll resulted in empty selection.');
            return _success();
        }

        async _deselectAll() {
            await _toPromise(this._grid.deselectAll());
            var selected = this._grid.getSelectedRowKeys();
            if (selected.length !== 0) return _failure('deselectAll failed. Still selected: ' + selected.length);
            return _success();
        }

        async _clearSelection() {
            this._grid.clearSelection();
            var selected = this._grid.getSelectedRowKeys();
            if (selected.length !== 0) return _failure('clearSelection failed. Still selected: ' + selected.length);
            return _success();
        }

        async _columnsVisibility(p) {
            var err = this._validateCol(p.dataField); if (err) return err;
            this._grid.columnOption(p.dataField, 'visible', p.visible);
            var actual = this._grid.columnOption(p.dataField, 'visible');
            if (actual !== p.visible)
                return _failure('Expected visible=' + p.visible + ' for "' + p.dataField + '", got ' + actual);
            return _success();
        }

        async _columnsReorder(p) {
            var err = this._validateCol(p.dataField); if (err) return err;
            if (!Number.isInteger(p.visibleIndex) || p.visibleIndex < 0)
                return _failure('visibleIndex must be non-negative integer. Got: ' + p.visibleIndex);
            this._grid.columnOption(p.dataField, 'visibleIndex', p.visibleIndex);
            var actual = this._grid.columnOption(p.dataField, 'visibleIndex');
            if (actual !== p.visibleIndex)
                return _failure('Expected visibleIndex ' + p.visibleIndex + ' for "' + p.dataField + '", got ' + actual);
            return _success();
        }

        async _columnsPinning(p) {
            var err = this._validateCol(p.dataField); if (err) return err;
            this._grid.columnOption(p.dataField, {
                fixed: p.fixed,
                fixedPosition: p.fixed ? (p.fixedPosition || 'left') : undefined
            });
            var actualFixed = this._grid.columnOption(p.dataField, 'fixed');
            if (actualFixed !== p.fixed)
                return _failure('Expected fixed=' + p.fixed + ' for "' + p.dataField + '", got ' + actualFixed);
            if (p.fixed) {
                var expectedPos = p.fixedPosition || 'left';
                var actualPos = this._grid.columnOption(p.dataField, 'fixedPosition');
                if (actualPos !== expectedPos)
                    return _failure('Expected fixedPosition "' + expectedPos + '" for "' + p.dataField + '", got "' + actualPos + '".');
            }
            return _success();
        }

        async _columnsResize(p) {
            var err = this._validateCol(p.dataField); if (err) return err;
            if (typeof p.width === 'number' && p.width <= 0)
                return _failure('width must be positive. Got: ' + p.width);
            this._grid.columnOption(p.dataField, 'width', p.width);
            var actual = this._grid.columnOption(p.dataField, 'width');
            if (actual !== p.width)
                return _failure('Expected width ' + p.width + ' for "' + p.dataField + '", got ' + actual);
            return _success();
        }

        async _summary(p) {
            if (p.totalItems === undefined && p.groupItems === undefined)
                return _failure('summary payload must include at least one of "totalItems" or "groupItems".');
            var current = this._grid.option('summary') || {};
            var newSummary = Object.assign({}, current);
            if (p.totalItems !== undefined) newSummary.totalItems = p.totalItems;
            if (p.groupItems !== undefined) newSummary.groupItems = p.groupItems;
            this._grid.option('summary', newSummary);
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var applied = this._grid.option('summary') || {};
            if (p.totalItems !== undefined) {
                var actualTotal = applied.totalItems || [];
                if (actualTotal.length !== p.totalItems.length)
                    return _failure('Expected ' + p.totalItems.length + ' totalItems, got ' + actualTotal.length);
            }
            if (p.groupItems !== undefined) {
                var actualGroup = applied.groupItems || [];
                if (actualGroup.length !== p.groupItems.length)
                    return _failure('Expected ' + p.groupItems.length + ' groupItems, got ' + actualGroup.length);
            }
            return _success();
        }

        async _clearSummary() {
            this._grid.option('summary', { totalItems: [], groupItems: [] });
            var refreshErr = await this._waitForDataReady(); if (refreshErr) return refreshErr;
            var applied = this._grid.option('summary') || {};
            var totalItems = applied.totalItems || [];
            var groupItems = applied.groupItems || [];
            if (totalItems.length > 0 || groupItems.length > 0)
                return _failure('clearSummary failed. totalItems: ' + totalItems.length + ', groupItems: ' + groupItems.length);
            return _success();
        }
    }

    /**
     * ====================================================================
     *  Action definitions — each entry becomes a button
     * ====================================================================
     */

    var ACTION_DEFS = [
        // ── 1. Sorting ──────────────────────────
        { section: 'Sorting',
          label: 'Sort LastName ASC',
          action: 'sorting',
          args: { dataField: 'LastName', sortOrder: 'asc' },
          expect: 'success',
          tip: 'Action: sorting\nArgs: { dataField: "LastName", sortOrder: "asc" }\nExpect: LastName column sorted ascending' },

        { section: 'Sorting',
          label: 'Sort LastName DESC',
          action: 'sorting',
          args: { dataField: 'LastName', sortOrder: 'desc' },
          expect: 'success',
          tip: 'Action: sorting\nArgs: { dataField: "LastName", sortOrder: "desc" }\nExpect: LastName column sorted descending' },

        { section: 'Sorting',
          label: 'Remove Sort from LastName',
          action: 'sorting',
          args: { dataField: 'LastName', sortOrder: 'none' },
          expect: 'success',
          tip: 'Action: sorting\nArgs: { dataField: "LastName", sortOrder: "none" }\nExpect: Sorting cleared on LastName column' },

        { section: 'Sorting',
          label: '⛔ Sort Non-Existent Column',
          action: 'sorting',
          args: { dataField: 'NoSuchField', sortOrder: 'asc' },
          expect: 'failure',
          tip: 'Action: sorting\nArgs: { dataField: "NoSuchField", sortOrder: "asc" }\nExpect: FAILURE — column does not exist' },

        { section: 'Sorting',
          label: 'Clear All Sorting',
          action: 'clearSorting',
          args: {},
          expect: 'success',
          tip: 'Action: clearSorting\nArgs: {} (none)\nExpect: All column sort orders removed' },

        // ── 2. Filtering (per-column) ───────────
        { section: 'Filtering (per-column)',
          label: 'Filter City = "Boise"',
          action: 'filtering',
          args: { dataField: 'City', filterValue: 'Boise' },
          expect: 'success',
          tip: 'Action: filtering\nArgs: { dataField: "City", filterValue: "Boise" }\nExpect: Only rows with City "Boise" shown' },

        { section: 'Filtering (per-column)',
          label: 'Clear Filter on City',
          action: 'filtering',
          args: { dataField: 'City', filterValue: null },
          expect: 'success',
          tip: 'Action: filtering\nArgs: { dataField: "City", filterValue: null }\nExpect: City column filter cleared, all rows shown' },

        // ── 3. FilterValue (combined expression) ─
        { section: 'FilterValue (combined)',
          label: 'Set State = "California"',
          action: 'filterValue',
          args: { expression: ['State', '=', 'California'] },
          expect: 'success',
          tip: 'Action: filterValue\nArgs: { expression: ["State", "=", "California"] }\nExpect: Top-level filterValue set; only California rows shown' },

        { section: 'FilterValue (combined)',
          label: 'Clear filterValue',
          action: 'filterValue',
          args: { expression: null },
          expect: 'success',
          tip: 'Action: filterValue\nArgs: { expression: null }\nExpect: Top-level filterValue removed, all rows shown' },

        // ── 4. Clear Filter ─────────────────────
        { section: 'Clear Filter',
          label: 'Apply City Filter, then Clear All',
          action: '_sequence_clearFilter',
          args: {},
          expect: 'success',
          tip: 'Sequence:\n1. filtering { dataField: "City", filterValue: "Boise" }\n2. clearFilter {}\nExpect: All filters removed (column + combined)' },

        // ── 5. Searching ────────────────────────
        { section: 'Searching',
          label: 'Search "Carter"',
          action: 'searching',
          args: { text: 'Carter' },
          expect: 'success',
          tip: 'Action: searching\nArgs: { text: "Carter" }\nExpect: Search panel set to "Carter", grid filtered to matching rows' },

        { section: 'Searching',
          label: 'Clear Search',
          action: 'searching',
          args: { text: '' },
          expect: 'success',
          tip: 'Action: searching\nArgs: { text: "" }\nExpect: Search cleared, all rows shown' },

        // ── 6. Grouping ─────────────────────────
        { section: 'Grouping',
          label: 'Group by State',
          action: 'grouping',
          args: { dataField: 'State', groupIndex: 0 },
          expect: 'success',
          tip: 'Action: grouping\nArgs: { dataField: "State", groupIndex: 0 }\nExpect: Rows grouped by State at first group level' },

        { section: 'Grouping',
          label: 'Ungroup State',
          action: 'grouping',
          args: { dataField: 'State', groupIndex: undefined },
          expect: 'success',
          tip: 'Action: grouping\nArgs: { dataField: "State", groupIndex: undefined }\nExpect: State grouping removed' },

        // ── 7. Paging ───────────────────────────
        { section: 'Paging',
          label: 'Set Page Size to 10',
          action: 'pageSize',
          args: { pageSize: 10 },
          expect: 'success',
          tip: 'Action: pageSize\nArgs: { pageSize: 10 }\nExpect: Grid shows 10 rows per page' },

        { section: 'Paging',
          label: 'Set Page Size to 5',
          action: 'pageSize',
          args: { pageSize: 5 },
          expect: 'success',
          tip: 'Action: pageSize\nArgs: { pageSize: 5 }\nExpect: Grid shows 5 rows per page' },

        { section: 'Paging',
          label: 'Go to Page 2',
          action: 'page',
          args: { page: 2 },
          expect: 'success',
          tip: 'Action: page\nArgs: { page: 2 }\nExpect: Grid navigates to second page' },

        { section: 'Paging',
          label: 'Go to Page 1',
          action: 'page',
          args: { page: 1 },
          expect: 'success',
          tip: 'Action: page\nArgs: { page: 1 }\nExpect: Grid returns to first page' },

        { section: 'Paging',
          label: '⛔ Page Out of Range',
          action: 'page',
          args: { page: 999 },
          expect: 'failure',
          tip: 'Action: page\nArgs: { page: 999 }\nExpect: FAILURE — page exceeds total page count' },

        { section: 'Paging',
          label: '⛔ Negative Page Size',
          action: 'pageSize',
          args: { pageSize: -1 },
          expect: 'failure',
          tip: 'Action: pageSize\nArgs: { pageSize: -1 }\nExpect: FAILURE — pageSize must be a positive integer' },

        // ── 8. Row Focusing ─────────────────────
        { section: 'Row Focusing',
          label: 'Focus Row Key = 3',
          action: 'rowFocusing',
          args: { key: 3 },
          expect: 'success',
          tip: 'Action: rowFocusing\nArgs: { key: 3 }\nExpect: Row with ID 3 (Robert Reagan) focused and scrolled into view' },

        { section: 'Row Focusing',
          label: 'Focus Row Key = 7',
          action: 'rowFocusing',
          args: { key: 7 },
          expect: 'success',
          tip: 'Action: rowFocusing\nArgs: { key: 7 }\nExpect: Row with ID 7 (Kevin Carter) focused and scrolled into view' },

        // ── 9. Selection ────────────────────────
        { section: 'Selection',
          label: 'Select Keys [1, 4, 6]',
          action: 'selectByKeys',
          args: { keys: [1, 4, 6], preserve: false },
          expect: 'success',
          tip: 'Action: selectByKeys\nArgs: { keys: [1, 4, 6], preserve: false }\nExpect: Rows 1, 4, 6 selected; previous selection replaced' },

        { section: 'Selection',
          label: 'Select Key [8] (preserve)',
          action: 'selectByKeys',
          args: { keys: [8], preserve: true },
          expect: 'success',
          tip: 'Action: selectByKeys\nArgs: { keys: [8], preserve: true }\nExpect: Row 8 added to existing selection' },

        { section: 'Selection',
          label: 'Select by Indexes [0, 2]',
          action: 'selectByIndexes',
          args: { indexes: [0, 2] },
          expect: 'success',
          tip: 'Action: selectByIndexes\nArgs: { indexes: [0, 2] }\nExpect: Visible rows at positions 0 and 2 selected' },

        { section: 'Selection',
          label: 'Select All',
          action: 'selectAll',
          args: {},
          expect: 'success',
          tip: 'Action: selectAll\nArgs: {} (none)\nExpect: All rows across all pages selected' },

        { section: 'Selection',
          label: 'Deselect All',
          action: 'deselectAll',
          args: {},
          expect: 'success',
          tip: 'Action: deselectAll\nArgs: {} (none)\nExpect: All rows deselected' },

        { section: 'Selection',
          label: 'Clear Selection',
          action: 'clearSelection',
          args: {},
          expect: 'success',
          tip: 'Action: clearSelection\nArgs: {} (none)\nExpect: Selection cleared completely' },

        // ── 10. Columns — Visibility ────────────
        { section: 'Columns — Visibility',
          label: 'Hide "HireDate"',
          action: 'columnsVisibility',
          args: { dataField: 'HireDate', visible: false },
          expect: 'success',
          tip: 'Action: columnsVisibility\nArgs: { dataField: "HireDate", visible: false }\nExpect: HireDate column hidden from grid' },

        { section: 'Columns — Visibility',
          label: 'Show "HireDate"',
          action: 'columnsVisibility',
          args: { dataField: 'HireDate', visible: true },
          expect: 'success',
          tip: 'Action: columnsVisibility\nArgs: { dataField: "HireDate", visible: true }\nExpect: HireDate column visible again' },

        { section: 'Columns — Visibility',
          label: '⛔ Hide Non-Existent Column',
          action: 'columnsVisibility',
          args: { dataField: 'Nope', visible: false },
          expect: 'failure',
          tip: 'Action: columnsVisibility\nArgs: { dataField: "Nope", visible: false }\nExpect: FAILURE — column "Nope" does not exist' },

        // ── 11. Columns — Reordering ────────────
        { section: 'Columns — Reordering',
          label: 'Move "Position" to Index 0',
          action: 'columnsReorder',
          args: { dataField: 'Position', visibleIndex: 0 },
          expect: 'success',
          tip: 'Action: columnsReorder\nArgs: { dataField: "Position", visibleIndex: 0 }\nExpect: Position column becomes first visible column' },

        { section: 'Columns — Reordering',
          label: 'Move "Position" back to Index 3',
          action: 'columnsReorder',
          args: { dataField: 'Position', visibleIndex: 3 },
          expect: 'success',
          tip: 'Action: columnsReorder\nArgs: { dataField: "Position", visibleIndex: 3 }\nExpect: Position column returns to 4th position' },

        // ── 12. Columns — Pinning ───────────────
        { section: 'Columns — Pinning',
          label: 'Pin "FirstName" to Left',
          action: 'columnsPinning',
          args: { dataField: 'FirstName', fixed: true, fixedPosition: 'left' },
          expect: 'success',
          tip: 'Action: columnsPinning\nArgs: { dataField: "FirstName", fixed: true, fixedPosition: "left" }\nExpect: FirstName pinned to left edge' },

        { section: 'Columns — Pinning',
          label: 'Pin "LastName" to Right',
          action: 'columnsPinning',
          args: { dataField: 'LastName', fixed: true, fixedPosition: 'right' },
          expect: 'success',
          tip: 'Action: columnsPinning\nArgs: { dataField: "LastName", fixed: true, fixedPosition: "right" }\nExpect: LastName pinned to right edge' },

        { section: 'Columns — Pinning',
          label: 'Unpin "FirstName"',
          action: 'columnsPinning',
          args: { dataField: 'FirstName', fixed: false },
          expect: 'success',
          tip: 'Action: columnsPinning\nArgs: { dataField: "FirstName", fixed: false }\nExpect: FirstName unfixed, scrolls normally' },

        { section: 'Columns — Pinning',
          label: 'Unpin "LastName"',
          action: 'columnsPinning',
          args: { dataField: 'LastName', fixed: false },
          expect: 'success',
          tip: 'Action: columnsPinning\nArgs: { dataField: "LastName", fixed: false }\nExpect: LastName unfixed, scrolls normally' },

        // ── 13. Columns — Resizing ──────────────
        { section: 'Columns — Resizing',
          label: 'Resize "FirstName" to 200px',
          action: 'columnsResize',
          args: { dataField: 'FirstName', width: 200 },
          expect: 'success',
          tip: 'Action: columnsResize\nArgs: { dataField: "FirstName", width: 200 }\nExpect: FirstName column width set to 200px' },

        { section: 'Columns — Resizing',
          label: 'Resize "FirstName" to "30%"',
          action: 'columnsResize',
          args: { dataField: 'FirstName', width: '30%' },
          expect: 'success',
          tip: 'Action: columnsResize\nArgs: { dataField: "FirstName", width: "30%" }\nExpect: FirstName column width set to 30% of grid' },

        { section: 'Columns — Resizing',
          label: '⛔ Negative Width',
          action: 'columnsResize',
          args: { dataField: 'FirstName', width: -50 },
          expect: 'failure',
          tip: 'Action: columnsResize\nArgs: { dataField: "FirstName", width: -50 }\nExpect: FAILURE — width must be positive' },

        // ── 14. Summary (Aggregation) ─────────────
        { section: 'Summary (Aggregation)',
          label: 'Add Total: Count of ID',
          action: 'summary',
          args: { totalItems: [{ column: 'ID', summaryType: 'count' }] },
          expect: 'success',
          tip: 'Action: summary\nArgs: { totalItems: [{ column: "ID", summaryType: "count" }] }\nExpect: Footer shows Count of ID' },

        { section: 'Summary (Aggregation)',
          label: 'Add Total: Count + Min HireDate',
          action: 'summary',
          args: { totalItems: [
              { column: 'ID', summaryType: 'count' },
              { column: 'HireDate', summaryType: 'min', valueFormat: 'shortDate' },
          ] },
          expect: 'success',
          tip: 'Action: summary\nArgs: { totalItems: [count of ID, min of HireDate] }\nExpect: Footer shows Count and Min HireDate' },

        { section: 'Summary (Aggregation)',
          label: 'Add Group Summary: Count',
          action: 'summary',
          args: { groupItems: [{ column: 'ID', summaryType: 'count', displayFormat: '{0} items' }] },
          expect: 'success',
          tip: 'Action: summary\nArgs: { groupItems: [{ column: "ID", summaryType: "count" }] }\nExpect: Group rows show item count (group by a column first)' },

        { section: 'Summary (Aggregation)',
          label: '⛔ Empty Payload',
          action: 'summary',
          args: {},
          expect: 'failure',
          tip: 'Action: summary\nArgs: {} (no totalItems or groupItems)\nExpect: FAILURE — must include at least one of totalItems or groupItems' },

        { section: 'Summary (Aggregation)',
          label: 'Clear Summary',
          action: 'clearSummary',
          args: {},
          expect: 'success',
          tip: 'Action: clearSummary\nArgs: {} (none)\nExpect: All summary items removed from footer and group rows' },

        // ── 15. Validation ──────────────────────
        { section: 'Validation',
          label: '⛔ Unknown Action "fooBar"',
          action: 'fooBar',
          args: {},
          expect: 'failure',
          tip: 'Action: "fooBar" (invalid)\nArgs: {}\nExpect: FAILURE — action name not in the available list' },
    ];

    /**
     * ====================================================================
     *  Sample data & DataGrid setup
     * ====================================================================
     */

    var sampleData = [
        { ID: 1,  FirstName: 'John',    LastName: 'Heart',     Position: 'CEO',       City: 'Los Angeles', State: 'California', HireDate: '2012-03-15' },
        { ID: 2,  FirstName: 'Olivia',  LastName: 'Peyton',    Position: 'Sales',     City: 'Los Angeles', State: 'California', HireDate: '2012-01-24' },
        { ID: 3,  FirstName: 'Robert',  LastName: 'Reagan',    Position: 'CMO',       City: 'Little Rock', State: 'Arkansas',   HireDate: '2013-05-07' },
        { ID: 4,  FirstName: 'Greta',   LastName: 'Sims',      Position: 'HR',        City: 'San Jose',    State: 'California', HireDate: '2013-08-14' },
        { ID: 5,  FirstName: 'Brett',   LastName: 'Wade',      Position: 'IT',        City: 'Reno',        State: 'Nevada',     HireDate: '2014-02-19' },
        { ID: 6,  FirstName: 'Sandra',  LastName: 'Johnson',   Position: 'Manager',   City: 'Denver',      State: 'Colorado',   HireDate: '2014-05-22' },
        { ID: 7,  FirstName: 'Kevin',   LastName: 'Carter',    Position: 'Logistics', City: 'Boise',       State: 'Idaho',      HireDate: '2015-01-11' },
        { ID: 8,  FirstName: 'Cynthia', LastName: 'Stanwick',  Position: 'Analytics', City: 'Little Rock', State: 'Arkansas',   HireDate: '2015-07-03' },
        { ID: 9,  FirstName: 'Kent',    LastName: 'Samuelson', Position: 'Legal',     City: 'Boise',       State: 'Idaho',      HireDate: '2016-09-28' },
        { ID: 10, FirstName: 'Taylor',  LastName: 'Riley',     Position: 'Support',   City: 'San Jose',    State: 'California', HireDate: '2016-12-01' },
    ];

    // Shared grid config (without dataSource / remoteOperations)
    var gridConfig = {
        keyExpr: 'ID',
        showBorders: true,
        allowColumnReordering: true,
        allowColumnResizing: true,
        columnFixing: { enabled: true },
        focusedRowEnabled: true,
        selection: { mode: 'multiple' },
        searchPanel: { visible: true },
        filterRow: { visible: true },
        groupPanel: { visible: true },
        paging: { pageSize: 5 },
        pager: {
            visible: true,
            showPageSizeSelector: true,
            allowedPageSizes: [5, 10],
            showNavigationButtons: true,
            showInfo: true,
        },
        columns: [
            { dataField: 'ID', width: 60 },
            { dataField: 'FirstName' },
            { dataField: 'LastName' },
            { dataField: 'Position' },
            { dataField: 'City' },
            { dataField: 'State' },
            { dataField: 'HireDate', dataType: 'date' },
        ],
    };

    $(() => {
        // ── Data sources ──

        var localDataSource = sampleData;

        var REMOTE_LATENCY_MS = 500;

        var remoteBackingStore = new DevExpress.data.ArrayStore({
            key: 'ID',
            data: sampleData.map(function(r) { return $.extend({}, r); }),
        });

        var remoteDataSource = {
            store: new DevExpress.data.CustomStore({
                key: 'ID',
                load: function(loadOptions) {
                    var d = $.Deferred();
                    setTimeout(function() {
                        remoteBackingStore.load(loadOptions).done(function(data) {
                            remoteBackingStore.totalCount(loadOptions).done(function(count) {
                                d.resolve(data, { totalCount: count });
                            });
                        }).fail(d.reject);
                    }, REMOTE_LATENCY_MS);
                    return d.promise();
                },
                byKey: function(key) {
                    return remoteBackingStore.byKey(key);
                },
                totalCount: function(loadOptions) {
                    var d = $.Deferred();
                    setTimeout(function() {
                        remoteBackingStore.totalCount(loadOptions).done(d.resolve).fail(d.reject);
                    }, REMOTE_LATENCY_MS);
                    return d.promise();
                },
            }),
        };

        // ── State ──

        var isRemote = false;
        var api = null;

        function createGrid() {
            var $container = $('#gridContainer');
            // Dispose previous instance if any
            var prev = $container.data('dxDataGrid');
            if (prev) prev.dispose();
            $container.empty();

            var opts = $.extend(true, {}, gridConfig);
            opts.dataSource = isRemote ? remoteDataSource : localDataSource;
            if (isRemote) {
                opts.remoteOperations = { filtering: true, sorting: true, paging: true, grouping: true };
            }

            var grid = $container.dxDataGrid(opts).dxDataGrid('instance');
            api = new DataGridToolingApi(grid);
        }

        createGrid();

        // ── Log ──

        const $log = $('#log');

        function logSection(title) {
            $log.append('<div class="log-section">── ' + title + ' ──</div>');
        }

        function logResult(label, result, expectedStatus) {
            var cls = result.status === 'success' ? 'log-success' : 'log-failure';
            var icon = result.status === 'success' ? '✓' : '✗';
            var text = icon + ' ' + label;
            if (result.status === 'failure') text += ' — ' + result.error;
            $log.append('<div class="' + cls + '">' + text + '</div>');

            // Warn if outcome doesn't match expectation
            if (expectedStatus && result.status !== expectedStatus) {
                $log.append('<div class="log-failure" style="margin-left:18px">⚠ Unexpected! Expected ' + expectedStatus + ' but got ' + result.status + '</div>');
            }
        }

        function logArgs(argsObj) {
            $log.append('<div class="log-args">↳ args: ' + JSON.stringify(argsObj) + '</div>');
        }

        // ── Execute a single action def ──

        async function runActionDef(def) {
            var modeLabel = isRemote ? '🌐 ' : '';

            if (def.action === '_sequence_clearFilter') {
                logSection(modeLabel + def.section);
                $log.append('<div class="log-args">Step 1: filtering { dataField: "City", filterValue: "Boise" }</div>');
                await api.action('filtering', { dataField: 'City', filterValue: 'Boise' });
                $log.append('<div class="log-args">Step 2: clearFilter {}</div>');
                var result = await api.action('clearFilter', {});
                logResult(modeLabel + def.label, result, def.expect);
                return;
            }

            logSection(modeLabel + def.section + ' → ' + def.label);
            logArgs(def.args);
            var result = await api.action(def.action, def.args);
            logResult(modeLabel + def.label, result, def.expect);
        }

        // ── Build action buttons panel ──

        var $panel = $('#actions-panel');
        var currentSection = '';
        var $sectionBody = null;

        ACTION_DEFS.forEach(function(def) {
            if (def.section !== currentSection) {
                currentSection = def.section;
                var $section = $('<div class="action-section">');
                $section.append('<div class="action-section-header">' + currentSection + '</div>');
                $sectionBody = $('<div class="action-section-body">');
                $section.append($sectionBody);
                $panel.append($section);
            }

            var $wrap = $('<div class="action-btn-wrap">');
            var $btnContainer = $('<div>');
            $wrap.append($btnContainer);
            $wrap.append('<div class="tip">' + def.tip + '</div>');
            $sectionBody.append($wrap);

            var expectHint = def.expect === 'failure' ? '  (expect ✗)' : '';
            $btnContainer.dxButton({
                text: def.label + expectHint,
                type: def.expect === 'failure' ? 'danger' : 'normal',
                stylingMode: 'outlined',
                onClick: async function() {
                    await runActionDef(def);
                    $log[0].scrollTop = $log[0].scrollHeight;
                },
            });
        });

        // ── Data mode switch ──

        var $badge = $('#dataModeBadge');

        function updateBadge() {
            if (isRemote) {
                $badge.attr('class', 'remote').text('🌐 Remote data (' + REMOTE_LATENCY_MS + 'ms latency)');
            } else {
                $badge.attr('class', 'local').text('📦 Local data');
            }
        }

        $('#dataModeSwitch').dxSwitch({
            value: false,
            switchedOnText: 'Remote',
            switchedOffText: 'Local',
            // width: 90,
            onValueChanged: function(e) {
                isRemote = e.value;
                updateBadge();
                createGrid();
                $log.empty();
            },
        });

        // ── Run All button ──

        $('#runAllButton').dxButton({
            text: '▶ Run All Actions',
            type: 'default',
            onClick: async function() {
                $log.empty();
                var mode = isRemote ? '🌐 Remote' : '📦 Local';
                $log.append('<div class="log-section">' + mode + ' — Available actions: ' + api.getAvailableActions().join(', ') + '</div>');

                for (var i = 0; i < ACTION_DEFS.length; i++) {
                    await runActionDef(ACTION_DEFS[i]);
                }

                $log.append('<div class="log-section">── All ' + ACTION_DEFS.length + ' actions executed ──</div>');
                $log[0].scrollTop = $log[0].scrollHeight;
            },
        });

        // ── Clear Log button ──

        $('#clearLogButton').dxButton({
            text: '🗑 Clear Log',
            type: 'normal',
            stylingMode: 'outlined',
            onClick: function() { $log.empty(); },
        });
    });
    </script>
</body>
</html>
